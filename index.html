<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotus Bodhicitta System</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* Collapsible UI Control Panel */
        #ui-container {
            position: absolute; top: 15px; left: 15px;
            background: rgba(10, 15, 25, 0.85); padding: 14px 18px; border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            width: 290px; pointer-events: auto;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
        }
        #ui-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        h1 { font-size: 14px; margin: 0; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        #ui-toggle-btn { background: none; border: none; color: #ffd700; font-size: 12px; cursor: pointer; padding: 4px; transition: transform 0.3s ease; }
        #ui-content { margin-top: 12px; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 200px; opacity: 1; }
        #ui-container.collapsed { width: 220px; }
        #ui-container.collapsed #ui-toggle-btn { transform: rotate(-90deg); }
        #ui-container.collapsed #ui-content { max-height: 0; opacity: 0; margin-top: 0; overflow: hidden; pointer-events: none; }

        p { font-size: 11px; color: #aaa; margin: 0 0 12px 0; line-height: 1.4; }
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="range"] {
            width: 100%; background: #141a24; border: 1px solid #253043; color: #fff;
            padding: 6px; border-radius: 6px; outline: none; box-sizing: border-box; font-size: 11px;
        }
        details { background: rgba(20, 26, 36, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
        summary { font-size: 10px; color: #ffd700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; outline: none; user-select: none; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #05070a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; transition: opacity 0.6s ease;
        }
        .spinner { width: 40px; height: 40px; border: 2px solid rgba(255, 215, 0, 0.1); border-top-color: #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 16px; color: #ffd700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }

        @media (max-width: 600px) {
            #ui-container { width: calc(100% - 30px); max-width: none; top: 15px; left: 10px; }
            #ui-container.collapsed { width: calc(100% - 30px); }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Calibrating Lotus Bodhicitta System...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div id="ui-header">
            <h1>Lotus Bodhicitta</h1>
            <button id="ui-toggle-btn">▲</button>
        </div>
        <div id="ui-content">
            <p>3D Buddha Bodhicitta meditation environment with axial coordinate system.</p>

            <div class="control-group">
                <label>Auto-Rotation Speed (RPM)</label>
                <input type="range" id="rotation-speed" min="0" max="10" step="0.1" value="0">
            </div>

            <details>
                <summary>Core Glow Intensity</summary>
                <div style="margin-top: 8px;">
                    <input type="range" id="glow-intensity" min="0" max="3" step="0.1" value="1.5">
                </div>
            </details>
        </div>
    </div>

    <script>
        // =========================================================================
        // DATA — names, chakras & coordinates (preserved reference)
        // Coordinate convention: excelPos = [X, Y-up, Z-depth]
        // Render mapping: threeX = excelPos[0], threeY = excelPos[1], threeZ = excelPos[2]
        // =========================================================================
        const baseSphereData = [
            // --- Series: Thường Trụ Bất Biến ---
            { id: "B01", name: "Forehead",              excelPos: [0.0,  0.8, -0.1], chakra: "6 - Third Eye Chakra",      char: "𑖀",     phonetic: "A",     series: "Thường Trụ Bất Biến", dharma: "Cintamani Jewel" },
            { id: "B02", name: "Sacral Chakra",         excelPos: [0.0, -0.2,  0.0], chakra: "2 - Sacral Chakra",         char: "𑖢",     phonetic: "Pa",    series: "Thường Trụ Bất Biến", dharma: "Jewel Bowl" },
            { id: "B03", name: "Front Center",          excelPos: [0.0,  0.0, -0.1], chakra: "N/A",                       char: "𑖨",     phonetic: "Ra",    series: "Thường Trụ Bất Biến", dharma: "Lariat Rope" },
            { id: "B04", name: "Behind Center",         excelPos: [0.0,  0.0,  0.1], chakra: "N/A",                       char: "𑖜",     phonetic: "Nna",   series: "Thường Trụ Bất Biến", dharma: "Jewel Beads" },
            { id: "B05", name: "Above Right Knee",      excelPos: [0.5,  0.0, -0.5], chakra: "N/A",                       char: "𑖬",     phonetic: "Ssa",   series: "Thường Trụ Bất Biến", dharma: "Jewel Bow" },
            { id: "B06", name: "Above Left Knee",       excelPos: [-0.5, 0.0, -0.5], chakra: "N/A",                       char: "𑖪",     phonetic: "Va",    series: "Thường Trụ Bất Biến", dharma: "Jewel Arrow" },
            // --- Series: Liên Hoa Bồ Đề Tâm ---
            { id: "B07", name: "Bottom Outer",          excelPos: [0.0, -2.0,  0.0], chakra: "N/A",                       char: "𑖚",     phonetic: "Dda",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Moon Essence Mani" },
            { id: "B08", name: "Bottom Inner",          excelPos: [0.0, -1.0,  0.0], chakra: "N/A",                       char: "𑖧",     phonetic: "Ya",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Treasure Chest" },
            { id: "B09", name: "Center",                excelPos: [0.0,  0.0,  0.0], chakra: "3 - Solar Plexus Chakra",   char: "𑖓",     phonetic: "Ca",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Jewel Sword" },
            { id: "B10", name: "Top Inner",             excelPos: [0.0,  1.0,  0.0], chakra: "7 - Crown Chakra",          char: "𑖭",     phonetic: "Sa",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Sweet Dews" },
            { id: "B11", name: "Top Outer",             excelPos: [0.0,  2.0,  0.0], chakra: "N/A",                       char: "𑖤",     phonetic: "Ba",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Sun Essence Mani" },
            { id: "B12", name: "Back Outer",            excelPos: [0.0,  0.0,  2.0], chakra: "N/A",                       char: "𑖚",     phonetic: "Dda",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Moon Essence Mani" },
            { id: "B13", name: "Back Inner",            excelPos: [0.0,  0.0,  1.0], chakra: "N/A",                       char: "𑖎𑖿𑖬", phonetic: "Kssa",  series: "Liên Hoa Bồ Đề Tâm",  dharma: "Red Lotus" },
            { id: "B14", name: "Center",                excelPos: [0.0,  0.0,  0.0], chakra: "3 - Solar Plexus Chakra",   char: "𑖓",     phonetic: "Ca",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Jewel Sword" },
            { id: "B15", name: "Front Inner",           excelPos: [0.0,  0.0, -1.0], chakra: "N/A",                       char: "𑖐",     phonetic: "Ga",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "White Lotus" },
            { id: "B16", name: "Front Outer",           excelPos: [0.0,  0.0, -2.0], chakra: "N/A",                       char: "𑖤",     phonetic: "Ba",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Sun Essence Mani" },
            { id: "B17", name: "Right Outer",           excelPos: [2.0,  0.0,  0.0], chakra: "N/A",                       char: "𑖚",     phonetic: "Dda",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Moon Essence Mani" },
            { id: "B18", name: "Right Inner",           excelPos: [1.0,  0.0,  0.0], chakra: "N/A",                       char: "𑖭𑖿𑖪", phonetic: "Sva",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Purple Lotus" },
            { id: "B19", name: "Center",                excelPos: [0.0,  0.0,  0.0], chakra: "3 - Solar Plexus Chakra",   char: "𑖓",     phonetic: "Ca",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Jewel Sword" },
            { id: "B20", name: "Left Inner",            excelPos: [-1.0, 0.0,  0.0], chakra: "N/A",                       char: "𑖞",     phonetic: "Tha",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Blue Lotus" },
            { id: "B21", name: "Left Outer",            excelPos: [-2.0, 0.0,  0.0], chakra: "N/A",                       char: "𑖤",     phonetic: "Ba",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Sun Essence Mani" },
            { id: "B22", name: "Heart Chakra",          excelPos: [0.0,  0.2,  0.0], chakra: "4 - Heart Chakra",          char: "𑖪",     phonetic: "Va",    series: "Liên Hoa Bồ Đề Tâm",  dharma: "Integral Lotus" },
            { id: "B23", name: "Throat Chakra+",        excelPos: [0.0,  0.5, -0.1], chakra: "N/A",                       char: "𑖝𑖿𑖭", phonetic: "Tsa",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Jewel Axe" },
            { id: "B24", name: "Throat Chakra",         excelPos: [0.0,  0.5,  0.0], chakra: "5 - Throat Chakra",         char: "𑖬𑖿𑖘", phonetic: "Sstta", series: "Liên Hoa Bồ Đề Tâm",  dharma: "Pure Vase" },
            { id: "B25", name: "High Above Head",       excelPos: [0.0,  1.5,  0.0], chakra: "N/A",                       char: "𑖧𑖿𑖭", phonetic: "Ysa",   series: "Liên Hoa Bồ Đề Tâm",  dharma: "Transformation Buddha Atop The Crown" },
            // --- Series: Lục Tý ---
            { id: "B26", name: "Joined Palm",           excelPos: [0.0,  0.2, -0.3], chakra: "N/A",                       char: "𑖑",     phonetic: "Gha",   series: "Lục Tý",              dharma: "Joined Palm" },
            { id: "B27", name: "Lower Left Palm",       excelPos: [-0.2,-0.1, -0.3], chakra: "N/A",                       char: "𑖟",     phonetic: "Da",    series: "Lục Tý",              dharma: "Fearless Palm" },
            { id: "B28", name: "Lower Right Palm",      excelPos: [0.2, -0.1, -0.3], chakra: "N/A",                       char: "𑖭",     phonetic: "Sa",    series: "Lục Tý",              dharma: "Sweet Dews" },
            { id: "B29", name: "Upper Open Left Palm",  excelPos: [-0.5, 0.3, -0.5], chakra: "N/A",                       char: "𑖤",     phonetic: "Ba",    series: "Lục Tý",              dharma: "Sun Essence Mani" },
            { id: "B30", name: "Upper Open Right Palm", excelPos: [0.5,  0.3, -0.5], chakra: "N/A",                       char: "𑖚",     phonetic: "Dda",   series: "Lục Tý",              dharma: "Moon Essence Mani" },
            { id: "B31", name: "Meditation Mutra",      excelPos: [0.0, -0.1, -0.3], chakra: "N/A",                       char: "𑖛",     phonetic: "Ddha",  series: "Lục Tý",              dharma: "Thousand Hands & Eyes" },
            // --- Series: Ending ---
            { id: "B32", name: "Left Knee",             excelPos: [-0.5,-0.3, -0.4], chakra: "N/A",                       char: "𑖏",     phonetic: "Kha",   series: "Ending",              dharma: "Jewel Staff" },
            { id: "B33", name: "Right Knee",            excelPos: [0.5, -0.3, -0.4], chakra: "N/A",                       char: "𑖀",     phonetic: "A",     series: "Ending",              dharma: "Cintamani Jewel" },
            { id: "B34", name: "Center of Mandala",     excelPos: [0.0, -0.5,  0.0], chakra: "1 - Root Chakra",           char: "𑖣",     phonetic: "Pha",   series: "Ending",              dharma: "Non-retreating Dharma Wheel" }
        ];

        // =========================================================================
        // DOM references
        // =========================================================================
        const container          = document.getElementById('canvas-container');
        const rotationSpeedInput = document.getElementById('rotation-speed');
        const glowIntensityInput = document.getElementById('glow-intensity');
        const uiContainer        = document.getElementById('ui-container');
        const uiHeader           = document.getElementById('ui-header');
        const uiToggleBtn        = document.getElementById('ui-toggle-btn');
        const loadingOverlay     = document.getElementById('loading-overlay');
        const loadingText        = document.getElementById('loading-text');

        // =========================================================================
        // Scene, Camera, Renderer
        // =========================================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070a, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
        const initialCameraPos = new THREE.Vector3(4.53, 3.5, -2.11);
        initialCameraPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), 40 * Math.PI / 180);
        camera.position.copy(initialCameraPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 2;
        controls.target.set(0, 0, 0);

        // =========================================================================
        // Environment & Lights
        // =========================================================================
        function createStudioEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#101622');
            grad.addColorStop(0.5, '#05070a');
            grad.addColorStop(1, '#020305');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(40, 20, 30, 40);
            ctx.fillRect(180, 40, 40, 30);
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.environment = createStudioEnvMap();

        scene.add(new THREE.AmbientLight(0xffffff, 0.15));

        const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        keyLight.position.set(5, 8, 5); keyLight.castShadow = true; scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xdbe9ff, 1.0);
        fillLight.position.set(-5, 3, -5); scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(0, -5, 0); scene.add(rimLight);

        const coreLight = new THREE.PointLight(0x00aaff, 2.0, 5);
        coreLight.position.set(0, 0, 0); scene.add(coreLight);

        // =========================================================================
        // Materials
        // =========================================================================
        const privacyBlueGlass = new THREE.MeshPhysicalMaterial({
            color: 0x88ddff, emissive: 0x0044aa, emissiveIntensity: 0.4,
            roughness: 0.5, metalness: 0.1, transmission: 0.75, ior: 1.5, thickness: 1.8,
            transparent: true, opacity: 1.0, side: THREE.DoubleSide, depthWrite: false
        });
        const clearBubbleGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, roughness: 0.05, metalness: 0.1, transmission: 0.98,
            ior: 1.52, thickness: 0.3, transparent: true, opacity: 1.0,
            side: THREE.DoubleSide, depthWrite: false
        });

        // =========================================================================
        // Outer bubble
        // =========================================================================
        const outerBubble = new THREE.Mesh(new THREE.SphereGeometry(1.9, 64, 64), clearBubbleGlass);
        scene.add(outerBubble);

        // =========================================================================
        // Buddha model
        // =========================================================================
        const buddhaGroup = new THREE.Group();
        scene.add(buddhaGroup);

        const loader = new THREE.GLTFLoader();
        const MODEL_URL = 'glass+buddha+statue+3d+model.glb';

        loader.load(MODEL_URL,
            (gltf) => {
                const buddhaMesh = gltf.scene;
                buddhaMesh.traverse((node) => {
                    if (node.isMesh) {
                        node.material = privacyBlueGlass;
                        node.castShadow = true; node.receiveShadow = true;
                    }
                });
                buddhaMesh.scale.set(1.4, 1.4, 1.4);
                buddhaMesh.position.set(0.0, -0.5, -0.18);
                buddhaMesh.rotation.y = Math.PI / 2;
                buddhaGroup.add(buddhaMesh);
                loadingOverlay.style.opacity = 0;
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 600);
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const percent = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingText.innerText = `Calibrating Bodhicitta Matrix (${percent}%)`;
                }
            },
            (err) => {
                console.warn("Generating procedural fallback.", err);
                const fallbackGroup = new THREE.Group();
                const head = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), privacyBlueGlass);
                head.position.y = 0.55; fallbackGroup.add(head);
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.28, 0.65, 32), privacyBlueGlass);
                torso.position.y = 0.1; fallbackGroup.add(torso);
                const legs = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.12, 16, 100), privacyBlueGlass);
                legs.rotation.x = Math.PI / 2; legs.position.y = -0.25; fallbackGroup.add(legs);
                fallbackGroup.position.set(0.0, -0.5, -0.18);
                fallbackGroup.rotation.y = Math.PI / 2;
                buddhaGroup.add(fallbackGroup);
                loadingOverlay.style.opacity = 0;
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 600);
            }
        );

        // =========================================================================
        // Axial coordinate system — laser beams & labels (fixed in world space)
        // =========================================================================
        function createAxialLaserBeam(direction) {
            const beamGroup = new THREE.Group();
            const totalLength = 2.3, coneHeight = 0.15;
            const cylinderLength = totalLength - coneHeight;
            const cylinderRadius = 0.019, coneRadius = cylinderRadius * 2.2;
            const mat = new THREE.MeshBasicMaterial({
                color: 0x00d2ff, transparent: true, opacity: 0.8,
                blending: THREE.AdditiveBlending, side: THREE.DoubleSide
            });
            const shaft = new THREE.Mesh(new THREE.CylinderGeometry(cylinderRadius, cylinderRadius, cylinderLength, 16), mat);
            shaft.position.y = cylinderLength / 2; beamGroup.add(shaft);
            const head = new THREE.Mesh(new THREE.ConeGeometry(coneRadius, coneHeight, 16), mat);
            head.position.y = cylinderLength + (coneHeight / 2); beamGroup.add(head);
            beamGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), direction);
            return beamGroup;
        }

        [
            new THREE.Vector3( 1,  0,  0),
            new THREE.Vector3(-1,  0,  0),
            new THREE.Vector3( 0,  1,  0),
            new THREE.Vector3( 0, -1,  0),
            new THREE.Vector3( 0,  0,  1),
            new THREE.Vector3( 0,  0, -1)
        ].forEach((dir) => scene.add(createAxialLaserBeam(dir)));

        function createAxisLabel(text, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px sans-serif';
            ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 10;
            ctx.fillText(text, 64, 64);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.position.set(x, y, z);
            sprite.scale.set(0.6, 0.6, 1.0);
            scene.add(sprite);
        }
        createAxisLabel("+X",  3.2,  0,    0);
        createAxisLabel("-X", -3.2,  0,    0);
        createAxisLabel("+Y",  0,    3.2,  0);
        createAxisLabel("-Y",  0,   -3.2,  0);
        createAxisLabel("+Z",  0,    0,    3.2);
        createAxisLabel("-Z",  0,    0,   -3.2);

        // =========================================================================
        // UI bindings
        // =========================================================================
        uiHeader.addEventListener('click', () => {
            const isCollapsed = uiContainer.classList.toggle('collapsed');
            uiToggleBtn.innerText = isCollapsed ? '▼' : '▲';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // Animation loop
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Pulsing core glow
            const glowVal = parseFloat(glowIntensityInput.value);
            coreLight.intensity = (Math.sin(elapsedTime * 2) * 0.4 + 1.2) * glowVal;
            coreLight.position.y = Math.sin(elapsedTime * 0.6) * 0.5;

            // Auto-rotation (Buddha only; coordinate axes remain fixed)
            const rpm = parseFloat(rotationSpeedInput.value);
            const rotationStep = ((rpm * Math.PI * 2) / 60) * delta;
            buddhaGroup.rotation.y += rotationStep;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
