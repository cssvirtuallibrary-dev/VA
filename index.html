<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotus Bodhicitta — VA Viên Mãn</title>
    <style>
        body {
            margin:0; padding:0; overflow:hidden; background-color:#05070a;
            font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;
            color:#fff; user-select:none; -webkit-user-select:none;
        }
        #canvas-container { width:100vw; height:100vh; display:block; }

        #ui-container {
            position:absolute; top:15px; left:15px;
            background:rgba(10,15,25,0.85); padding:14px 18px; border-radius:14px;
            box-shadow:0 8px 32px rgba(0,0,0,0.6); border:1px solid rgba(255,255,255,0.08);
            width:260px; pointer-events:auto;
            backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
            transition:all 0.4s cubic-bezier(0.25,1,0.5,1); z-index:10;
        }
        #ui-header { display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
        h1 { font-size:14px; margin:0; color:#ffd700; text-transform:uppercase; letter-spacing:1px; font-weight:600; }
        #ui-toggle-btn { background:none; border:none; color:#ffd700; font-size:12px; cursor:pointer; padding:4px; transition:transform 0.3s ease; }
        #ui-content { margin-top:12px; transition:max-height 0.35s ease, opacity 0.35s ease; max-height:300px; opacity:1; overflow:hidden; }
        #ui-container.collapsed { width:200px; }
        #ui-container.collapsed #ui-toggle-btn { transform:rotate(-90deg); }
        #ui-container.collapsed #ui-content { max-height:0; opacity:0; margin-top:0; pointer-events:none; }

        p { font-size:11px; color:#aaa; margin:0 0 12px 0; line-height:1.5; }
        .control-group { margin-bottom:10px; }
        label { display:block; font-size:10px; color:#888; margin-bottom:4px; text-transform:uppercase; letter-spacing:0.5px; }
        input[type="range"] {
            width:100%; background:#141a24; border:1px solid #253043;
            padding:6px; border-radius:6px; outline:none; box-sizing:border-box;
        }
        .range-val { font-size:10px; color:#aaa; display:block; margin-top:3px; }
        details { background:rgba(20,26,36,0.5); border:1px solid rgba(255,255,255,0.05); border-radius:8px; padding:8px 10px; margin-top:8px; }
        summary { font-size:10px; color:#ffd700; cursor:pointer; text-transform:uppercase; letter-spacing:0.5px; outline:none; user-select:none; }

        #loading-overlay {
            position:absolute; top:0; left:0; width:100vw; height:100vh;
            background:#05070a; display:flex; flex-direction:column;
            justify-content:center; align-items:center; z-index:100; transition:opacity 0.6s ease;
        }
        .spinner { width:40px; height:40px; border:2px solid rgba(255,215,0,0.1); border-top-color:#ffd700; border-radius:50%; animation:spin 1s linear infinite; }
        @keyframes spin { to { transform:rotate(360deg); } }
        #loading-text { margin-top:16px; color:#ffd700; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; }

        @media (max-width:600px) {
            #ui-container { width:calc(100% - 30px); left:10px; }
            #ui-container.collapsed { width:calc(100% - 30px); }
        }
    </style>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div id="loading-overlay">
        <div class="spinner"></div>
        <div id="loading-text">Calibrating Lotus Bodhicitta System...</div>
    </div>

    <div id="canvas-container"></div>

    <div id="ui-container">
        <div id="ui-header">
            <h1>VA Viên Mãn</h1>
            <button id="ui-toggle-btn">▲</button>
        </div>
        <div id="ui-content">

            <div class="control-group">
                <label>Display Duration (s / node)</label>
                <!-- ✦ Default updated to 12.0 -->
                <input type="range" id="interval-speed" min="1.5" max="15.0" step="0.5" value="12.0">
                <span class="range-val" id="interval-label">12.0 s / node</span>
            </div>

            <div class="control-group">
                <label>Ripple Expansion Speed</label>
                <!-- ✦ Default updated to 1.1 -->
                <input type="range" id="ripple-speed" min="0.1" max="2.5" step="0.1" value="1.1">
                <span class="range-val" id="ripple-label">1.1</span>
            </div>

            <div class="control-group">
                <label>Auto-Rotation (RPM)</label>
                <!-- ✦ Default updated to 0.5 -->
                <input type="range" id="rotation-speed" min="0" max="10" step="0.1" value="0.5">
            </div>

            <details>
                <summary>Core Glow Intensity</summary>
                <div style="margin-top:8px;">
                    <input type="range" id="glow-intensity" min="0" max="3" step="0.1" value="1.5">
                </div>
            </details>
        </div>
    </div>

        // =========================================================================
        // Heart Chakra origin — single source of truth used by both nodes & ripples

        // =========================================================================

        // =========================================================================
        const animationNodes = [
            { id:"A01", name:"Heart Chakra", excelPos:[0.0, 0.2, 0.0], chakra:"4 - Heart Chakra", image:"01_VA_Gold.PNG",    char:"𑖪",        phonetic:"Va",         series:"VA Viên Mãn" },

        // =========================================================================
        // DOM references
        // =========================================================================
        const container          = document.getElementById('canvas-container');
        const rotationSpeedInput = document.getElementById('rotation-speed');
        const intervalSpeedInput = document.getElementById('interval-speed');
        const intervalLabel      = document.getElementById('interval-label');
        const rippleSpeedInput   = document.getElementById('ripple-speed');
        const rippleLabelEl      = document.getElementById('ripple-label');
        const glowIntensityInput = document.getElementById('glow-intensity');
        const uiContainer        = document.getElementById('ui-container');
        const uiHeader           = document.getElementById('ui-header');
        const uiToggleBtn        = document.getElementById('ui-toggle-btn');
        const loadingOverlay     = document.getElementById('loading-overlay');
        const loadingText        = document.getElementById('loading-text');

        // Scene, Camera, Renderer
        // =========================================================================
        const scene = new THREE.Scene();
        scene.fog = new THREE.FogExp2(0x05070a, 0.03);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);

        // Lowered viewing angle (Y = 1.8)
        const initialCameraPos = new THREE.Vector3(4.53, 1.8, -2.11);
        initialCameraPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), 40 * Math.PI / 180);
        camera.position.copy(initialCameraPos);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        const controls = new THREE.OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 2;
        controls.target.set(0, 0, 0);

        // =========================================================================
        // Environment & Lights
        // =========================================================================
        function createStudioEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#101622');
            grad.addColorStop(0.5, '#05070a');
            grad.addColorStop(1, '#020305');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(40, 20, 30, 40);
            ctx.fillRect(180, 40, 40, 30);
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.environment = createStudioEnvMap();

        scene.add(new THREE.AmbientLight(0xffffff, 0.15));

        const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        keyLight.position.set(5, 8, 5); keyLight.castShadow = true; scene.add(keyLight);

        const fillLight = new THREE.DirectionalLight(0xdbe9ff, 1.0);
        fillLight.position.set(-5, 3, -5); scene.add(fillLight);

        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(0, -5, 0); scene.add(rimLight);

        coreLight.position.set(0, 0, 0); scene.add(coreLight);

        // =========================================================================

            color:             0x1a5c38,   // dark jade green
            emissive:          0x0a2e1a,   // deep jade emissive
            emissiveIntensity: 0.25,
            roughness:         0.25,       // polished jade
            metalness:         0.1,
            transmission:      0.75,       // ✦ Transmissive physical glass style
            ior:               1.62,
            thickness:         0.5,        // depth refraction
            transparent:       true,       // ✦ Enabled transparency
            opacity:           0.5,        // ✦ Lower opacity to see internal characters
            side:              THREE.DoubleSide,
            depthWrite:        false       // ✦ Prevents the jade statue shell from depth-blocking the interior node
        });

        const clearBubbleGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, roughness: 0.05, metalness: 0.1, transmission: 0.98,
            ior: 1.52, thickness: 0.3, transparent: true, opacity: 1.0,
            side: THREE.DoubleSide, depthWrite: false
        });

        // =========================================================================
        // Outer bubble
        // =========================================================================
        const outerBubble = new THREE.Mesh(new THREE.SphereGeometry(1.9, 64, 64), clearBubbleGlass);
        scene.add(outerBubble);

        // =========================================================================
        // Buddha model
        // =========================================================================
        const buddhaGroup = new THREE.Group();
        scene.add(buddhaGroup);

        function onModelReady() {
            loadingOverlay.style.opacity = 0;
            setTimeout(() => { loadingOverlay.style.display = 'none'; startLoop(); }, 650);
        }

        const loader = new THREE.GLTFLoader();
        loader.load(
            'glass+buddha+statue+3d+model.glb',
            (gltf) => {
                const m = gltf.scene;
                m.traverse((node) => {
                    if (node.isMesh) { node.material = GreenJade; node.castShadow = true; node.receiveShadow = true; }
                });
                m.scale.set(1.4, 1.4, 1.4);
                m.position.set(0.0, -0.5, -0.18);
                m.rotation.y = Math.PI / 2;
                buddhaGroup.add(m);
                onModelReady();
            },
            (xhr) => {
                if (xhr.total > 0) loadingText.innerText = `Loading (${Math.round((xhr.loaded / xhr.total) * 100)}%)`;
            },
            (err) => {
                console.warn("Procedural fallback.", err);
                const fg = new THREE.Group();
                const head  = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), GreenJade);
                head.position.y = 0.55; fg.add(head);
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.28, 0.65, 32), GreenJade);
                torso.position.y = 0.1; fg.add(torso);
                const legs  = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.12, 16, 100), GreenJade);
                legs.rotation.x = Math.PI / 2; legs.position.y = -0.25; fg.add(legs);
                fg.position.set(0.0, -0.5, -0.18); fg.rotation.y = Math.PI / 2;
                buddhaGroup.add(fg);
                onModelReady();
            }
        );

        // =========================================================================
        // Axis labels
        // =========================================================================
        function createAxisLabel(text, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px sans-serif';
            ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 10;
            ctx.fillText(text, 64, 64);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: new THREE.CanvasTexture(canvas), transparent: true }));
            sprite.position.set(x, y, z);
            sprite.scale.set(0.6, 0.6, 1.0);
            scene.add(sprite);
        }
        createAxisLabel("+X",  3.2,  0,    0);
        createAxisLabel("-X", -3.2,  0,    0);
        createAxisLabel("+Y",  0,    3.2,  0);
        createAxisLabel("-Y",  0,   -3.2,  0);
        createAxisLabel("+Z",  0,    0,    3.2);
        createAxisLabel("-Z",  0,    0,   -3.2);

        // Node spheres & glyph planes — all at HEART_CHAKRA
        // =========================================================================
        const NODE_SPHERE_GEO = new THREE.SphereGeometry(0.20, 32, 32);
        const NODE_PLANE_GEO  = new THREE.PlaneGeometry(0.26, 0.26);
        const textureLoader   = new THREE.TextureLoader();

        function createFallbackGlyphTexture(char, phonetic) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#cc88ff'; ctx.shadowBlur = 32;
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 200px sans-serif';
            ctx.fillText(char, 256, 205);
            ctx.shadowBlur = 8; ctx.fillStyle = '#ddaaff'; ctx.font = '600 44px sans-serif';
            ctx.fillText(phonetic, 256, 395);
            const tex = new THREE.CanvasTexture(canvas);
            
            if (THREE.SRGBColorSpace) {
                tex.colorSpace = THREE.SRGBColorSpace;
            } else if (THREE.sRGBEncoding) {
                tex.encoding = THREE.sRGBEncoding;
            }
            return tex;
        }

        animationNodes.forEach((data) => {
            const pos = new THREE.Vector3().fromArray(data.excelPos);

            // Transparent glass sphere wrapping the character
            const sphereMat = new THREE.MeshPhysicalMaterial({
                color:             0xffffff,
                emissive:          0x000000,
                emissiveIntensity: 0.0,
                roughness:         0.0,
                metalness:         0.0,
                transmission:      0.96,
                ior:               1.52,
                thickness:         0.30,
                transparent:       true,
                opacity:           1.0,
                side:              THREE.DoubleSide,
                depthWrite:        false
            });
            const sphere = new THREE.Mesh(NODE_SPHERE_GEO, sphereMat);
            sphere.position.copy(pos);
            sphere.visible = false;
            sphere.userData.nodeAge = 0;
            scene.add(sphere);
            data.sphereMesh = sphere;

            const glyphMat = new THREE.MeshBasicMaterial({
                map: createFallbackGlyphTexture(data.char, data.phonetic),
                transparent: true, side: THREE.DoubleSide, depthWrite: false,
                blending: THREE.AdditiveBlending
            });
            const plane = new THREE.Mesh(NODE_PLANE_GEO, glyphMat);
            plane.position.copy(pos);
            plane.visible = false;
            scene.add(plane);
            data.planeMesh = plane;

            textureLoader.load(
                data.image,
                (tex) => { 
                    if (THREE.SRGBColorSpace) {
                        tex.colorSpace = THREE.SRGBColorSpace;
                    } else if (THREE.sRGBEncoding) {
                        tex.encoding = THREE.sRGBEncoding;
                    }
                    glyphMat.map = tex; 
                    glyphMat.needsUpdate = true; 
                },
                undefined,
                () => {
                    textureLoader.load(
                        data.image.replace('.PNG', '.png'),
                        (tex) => { 
                            if (THREE.SRGBColorSpace) {
                                tex.colorSpace = THREE.SRGBColorSpace;
                            } else if (THREE.sRGBEncoding) {
                                tex.encoding = THREE.sRGBEncoding;
                            }
                            glyphMat.map = tex; 
                            glyphMat.needsUpdate = true; 
                        }
                    );
                }
            );
        });

        // =========================================================================
        // CONCENTRIC PULSE RIPPLE SYSTEM
        // =========================================================================
        const RIPPLE_GEO      = new THREE.SphereGeometry(1.0, 72, 36);
        const PULSE_PERIOD    = 1.6;
        const RINGS_PER_PULSE = 3;
        const RING_STAGGER    = 0.16;
        const RING_DURATION   = 5.5;
        const RING_MAX_RADIUS = 3.8;

        const PULSE_RINGS = [
            { peakOpacity: 0.13, colorHex: 0xffd700 },
            { peakOpacity: 0.09, colorHex: 0xffcc33 },
            { peakOpacity: 0.06, colorHex: 0xffe57a },
        ];

        const activeRipples = [];
        const pendingSpawns = [];
        let   pulseTimer    = 0;
        let   goldenFlash   = 0;

        function rippleOpacity(t, peak) {
            const riseT = 0.08;
            if (t < riseT) return peak * (t / riseT);
            const k = -Math.log(0.02) / (1.0 - riseT);
            return peak * Math.exp(-k * (t - riseT));
        }

        function spawnSingleRing(ringDef) {
            const mat = new THREE.MeshBasicMaterial({
                color: ringDef.colorHex, transparent: true, opacity: 0,
                side: THREE.DoubleSide, depthWrite: false, blending: THREE.AdditiveBlending
            });
            const mesh = new THREE.Mesh(RIPPLE_GEO, mat);

            mesh.position.copy(HEART_CHAKRA);
            mesh.scale.setScalar(0.001);
            mesh.userData = { age: 0, peakOpacity: ringDef.peakOpacity };
            scene.add(mesh);
            activeRipples.push(mesh);
        }

        function triggerPulse() {
            goldenFlash = 1.0;
            for (let i = 0; i < RINGS_PER_PULSE; i++) {
                pendingSpawns.push({ countdown: i * RING_STAGGER, ringDef: PULSE_RINGS[i] });
            }
        }

        // =========================================================================
        // Sequencer
        // =========================================================================
        let currentIndex = -1;
        let isRunning    = false;
        let seqTimer     = 0;

        function showNode(index) {
            animationNodes.forEach((d) => {
                if (d.sphereMesh) {
                    d.sphereMesh.visible = false;
                    d.sphereMesh.userData.nodeAge = 0;
                    d.sphereMesh.scale.setScalar(0.01);
                    d.sphereMesh.material.emissiveIntensity = 0;
                }
                if (d.planeMesh) d.planeMesh.visible = false;
            });
            if (index < 0 || index >= animationNodes.length) return;
            const d = animationNodes[index];
            if (d.sphereMesh) d.sphereMesh.visible = true;
            if (d.planeMesh)  d.planeMesh.visible  = true;
        }

        function startLoop() {
            isRunning    = true;
            currentIndex = 0;
            seqTimer     = 0;
            pulseTimer   = PULSE_PERIOD;
            showNode(0);
        }

        // =========================================================================
        // UI bindings
        // =========================================================================
        intervalSpeedInput.addEventListener('input', () => {
            intervalLabel.innerText = `${parseFloat(intervalSpeedInput.value).toFixed(1)} s / node`;
        });
        rippleSpeedInput.addEventListener('input', () => {
            rippleLabelEl.innerText = parseFloat(rippleSpeedInput.value).toFixed(1);
        });
        uiHeader.addEventListener('click', () => {
            const c = uiContainer.classList.toggle('collapsed');
            uiToggleBtn.innerText = c ? '▼' : '▲';
        });
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // Animation loop
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta       = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();
            const glowVal     = parseFloat(glowIntensityInput.value);
            const rippleSpd   = Math.max(0.1, parseFloat(rippleSpeedInput.value));

            // Blue core pulse at world origin
            coreLight.intensity  = (Math.sin(elapsedTime * 2.0) * 0.4 + 1.2) * glowVal;
            coreLight.position.y = Math.sin(elapsedTime * 0.6) * 0.5;

            // Heart accent light breathes gently — always centred at Heart Chakra
            heartLight.intensity = (Math.sin(elapsedTime * 1.4) * 0.2 + 0.7) * glowVal;

            // Golden flash at Heart Chakra
            goldenFlash = Math.max(0, goldenFlash - delta * 3.5);
            goldenCore.intensity = goldenFlash * 2.8 * glowVal;

            // Sequencer
            if (isRunning) {
                seqTimer += delta;
                const interval = parseFloat(intervalSpeedInput.value);
                if (seqTimer >= interval) {
                    seqTimer = 0;
                    currentIndex = (currentIndex + 1) % animationNodes.length;
                    showNode(currentIndex);
                }
            }

            // Active node — sphere pulse & glyph billboard
            if (isRunning && currentIndex >= 0) {
                const d = animationNodes[currentIndex];

                if (d.sphereMesh && d.sphereMesh.visible) {
                    d.sphereMesh.userData.nodeAge += delta;
                    const fadeIn = Math.min(1.0, d.sphereMesh.userData.nodeAge * 4.0);
                    const pulse  = 1.0 + Math.sin(elapsedTime * 3.2) * 0.10;
                    d.sphereMesh.scale.setScalar(fadeIn * pulse);
                    d.sphereMesh.material.emissiveIntensity =
                        fadeIn * (0.75 + Math.sin(elapsedTime * 3.2) * 0.25) * glowVal;
                }

                // Glyph: gentle float + always face camera
                if (d.planeMesh && d.planeMesh.visible) {
                    d.planeMesh.position.y = HEART_CHAKRA.y + Math.sin(elapsedTime * 1.9) * 0.015;
                    d.planeMesh.quaternion.copy(camera.quaternion);
                }
            }

            // Pulse heartbeat timer
            pulseTimer += delta;
            if (pulseTimer >= PULSE_PERIOD) {
                pulseTimer -= PULSE_PERIOD;
                triggerPulse();
            }

            // Resolve staggered ring spawns
            for (let i = pendingSpawns.length - 1; i >= 0; i--) {
                pendingSpawns[i].countdown -= delta;
                if (pendingSpawns[i].countdown <= 0) {
                    spawnSingleRing(pendingSpawns[i].ringDef);
                    pendingSpawns.splice(i, 1);
                }
            }

            // Ripple shell update
            const effectiveDuration = RING_DURATION / rippleSpd;
            for (let i = activeRipples.length - 1; i >= 0; i--) {
                const r = activeRipples[i];
                r.userData.age += delta;
                const t = Math.min(r.userData.age / effectiveDuration, 1.0);
                r.scale.setScalar(Math.max(0.001, t * RING_MAX_RADIUS));
                r.material.opacity = rippleOpacity(t, r.userData.peakOpacity) * glowVal;
                if (t >= 1.0) {
                    scene.remove(r);
                    r.material.dispose();
                    activeRipples.splice(i, 1);
                }
            }

            // Auto-rotation — Buddha group only, axis labels stay fixed
            const rpm = parseFloat(rotationSpeedInput.value);
            buddhaGroup.rotation.y += ((rpm * Math.PI * 2) / 60) * delta;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
