<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lotus Bodhicitta System</title>
    <style>
        body {
            margin: 0; padding: 0; overflow: hidden;
            background-color: #05070a;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #fff; user-select: none; -webkit-user-select: none;
        }
        #canvas-container { width: 100vw; height: 100vh; display: block; }

        /* Start Button */
        #action-container { position: absolute; top: 15px; left: 15px; z-index: 30; pointer-events: auto; }
        #start-btn {
            background: #ffd700; color: #05070a; border: 1px solid rgba(255, 215, 0, 0.6);
            padding: 12px 24px; border-radius: 12px; font-weight: bold; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1.5px; font-size: 12px;
            box-shadow: 0 0 20px rgba(255, 215, 0, 0.35);
            transition: all 0.3s cubic-bezier(0.25, 1, 0.5, 1);
        }
        #start-btn:hover { background: #ffe240; box-shadow: 0 0 30px rgba(255, 215, 0, 0.6); transform: translateY(-2px); }
        #start-btn:active { transform: translateY(1px); }

        /* Control Panel */
        #ui-container {
            position: absolute; top: 75px; left: 15px;
            background: rgba(10, 15, 25, 0.85); padding: 14px 18px; border-radius: 14px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.6); border: 1px solid rgba(255, 255, 255, 0.08);
            width: 290px; pointer-events: auto;
            backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
            transition: all 0.4s cubic-bezier(0.25, 1, 0.5, 1); z-index: 10;
        }
        #ui-header { display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
        h1 { font-size: 14px; margin: 0; color: #ffd700; text-transform: uppercase; letter-spacing: 1px; font-weight: 600; }
        #ui-toggle-btn { background: none; border: none; color: #ffd700; font-size: 12px; cursor: pointer; padding: 4px; transition: transform 0.3s ease; }
        #ui-content { margin-top: 12px; transition: max-height 0.3s ease, opacity 0.3s ease; max-height: 200px; opacity: 1; }
        #ui-container.collapsed { width: 220px; }
        #ui-container.collapsed #ui-toggle-btn { transform: rotate(-90deg); }
        #ui-container.collapsed #ui-content { max-height: 0; opacity: 0; margin-top: 0; overflow: hidden; pointer-events: none; }

        p { font-size: 11px; color: #aaa; margin: 0 0 12px 0; line-height: 1.4; }
        .control-group { margin-bottom: 10px; }
        label { display: block; font-size: 10px; color: #888; margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.5px; }
        input[type="range"] {
            width: 100%; background: #141a24; border: 1px solid #253043; color: #fff;
            padding: 6px; border-radius: 6px; outline: none; box-sizing: border-box; font-size: 11px;
        }
        details { background: rgba(20, 26, 36, 0.5); border: 1px solid rgba(255, 255, 255, 0.05); border-radius: 8px; padding: 8px 10px; margin-top: 8px; }
        summary { font-size: 10px; color: #ffd700; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; outline: none; user-select: none; }

        /* Node Info HUD */
        #node-hud {
            position: absolute; bottom: 25px; left: 50%;
            transform: translateX(-50%) translateY(120px);
            background: rgba(10, 15, 25, 0.88); border: 1px solid rgba(170, 0, 255, 0.35);
            border-radius: 14px; padding: 14px 20px; width: 85%; max-width: 340px;
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0; pointer-events: none; z-index: 20;
            box-shadow: 0 0 30px rgba(170, 0, 255, 0.2);
        }
        #node-hud.active { transform: translateX(-50%) translateY(0); opacity: 1; }
        #hud-id   { font-size: 10px; color: #aa00ff; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 4px; }
        #hud-name { font-size: 18px; font-weight: 700; color: #fff; margin-bottom: 6px; letter-spacing: 0.5px; }
        #hud-phonetic {
            font-family: Georgia, serif; font-style: italic;
            font-size: 28px; color: #ffd700; text-align: center;
            padding: 8px 0; border-top: 1px solid rgba(255,255,255,0.06);
            border-bottom: 1px solid rgba(255,255,255,0.06); margin-bottom: 8px;
            text-shadow: 0 0 20px rgba(255, 215, 0, 0.6);
        }
        .hud-row { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; }
        .hud-label { color: #77849a; }
        .hud-val   { color: #ddd; font-weight: 500; }
        #hud-progress { display: flex; gap: 6px; margin-top: 10px; justify-content: center; }
        .hud-dot {
            width: 8px; height: 8px; border-radius: 50%;
            background: rgba(170, 0, 255, 0.25); border: 1px solid rgba(170, 0, 255, 0.5);
            transition: background 0.3s ease, transform 0.3s ease;
        }
        .hud-dot.active { background: #aa00ff; transform: scale(1.4); box-shadow: 0 0 8px #aa00ff; }

        #loading-overlay {
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
            background: #05070a; display: flex; flex-direction: column;
            justify-content: center; align-items: center; z-index: 100; transition: opacity 0.6s ease;
        }
        .spinner { width: 40px; height: 40px; border: 2px solid rgba(255, 215, 0, 0.1); border-top-color: #ffd700; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        #loading-text { margin-top: 16px; color: #ffd700; font-size: 12px; letter-spacing: 1.5px; text-transform: uppercase; }

        @media (max-width: 600px) {
            #action-container { width: calc(100% - 30px); left: 10px; top: 10px; }
            #start-btn { width: 100%; text-align: center; }
            #ui-container { width: calc(100% - 30px); max-width: none; top: 75px; left: 10px; }
            #ui-container.collapsed { width: calc(100% - 30px); }
        }
    </style>

        initialCameraPos.applyAxisAngle(new THREE.Vector3(0, 1, 0), 40 * Math.PI / 180);

        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.2;
        container.appendChild(renderer.domElement);

        controls.dampingFactor = 0.05;
        controls.maxDistance = 30;
        controls.minDistance = 2;
        controls.target.set(0, 0, 0);

        // =========================================================================
        // Environment & Lights
        // =========================================================================
        function createStudioEnvMap() {
            const canvas = document.createElement('canvas');
            canvas.width = 256; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
            grad.addColorStop(0, '#101622');
            grad.addColorStop(0.5, '#05070a');
            grad.addColorStop(1, '#020305');
            ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(40, 20, 30, 40);
            ctx.fillRect(180, 40, 40, 30);
            const texture = new THREE.CanvasTexture(canvas);
            texture.mapping = THREE.EquirectangularReflectionMapping;
            return texture;
        }
        scene.environment = createStudioEnvMap();

        scene.add(new THREE.AmbientLight(0xffffff, 0.15));
        const keyLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        keyLight.position.set(5, 8, 5); keyLight.castShadow = true; scene.add(keyLight);
        const fillLight = new THREE.DirectionalLight(0xdbe9ff, 1.0);
        fillLight.position.set(-5, 3, -5); scene.add(fillLight);
        const rimLight = new THREE.DirectionalLight(0xffffff, 1.5);
        rimLight.position.set(0, -5, 0); scene.add(rimLight);
        const coreLight = new THREE.PointLight(0x00aaff, 2.0, 5);
        coreLight.position.set(0, 0, 0); scene.add(coreLight);

        // Purple heart-chakra accent light (activated during sequence)
        const heartLight = new THREE.PointLight(0xaa00ff, 0.0, 3.5);
        heartLight.position.set(0, 0.2, 0);
        scene.add(heartLight);

        // =========================================================================
        // Materials
        // =========================================================================
        const privacyBlueGlass = new THREE.MeshPhysicalMaterial({
            color: 0x88ddff, emissive: 0x0044aa, emissiveIntensity: 0.4,
            roughness: 0.5, metalness: 0.1, transmission: 0.75, ior: 1.5, thickness: 1.8,
            transparent: true, opacity: 1.0, side: THREE.DoubleSide, depthWrite: false
        });
        const clearBubbleGlass = new THREE.MeshPhysicalMaterial({
            color: 0xffffff, roughness: 0.05, metalness: 0.1, transmission: 0.98,
            ior: 1.52, thickness: 0.3, transparent: true, opacity: 1.0,
            side: THREE.DoubleSide, depthWrite: false
        });

        // =========================================================================
        // Outer bubble
        // =========================================================================
        const outerBubble = new THREE.Mesh(new THREE.SphereGeometry(1.9, 64, 64), clearBubbleGlass);
        scene.add(outerBubble);

        // =========================================================================
        // Buddha model
        // =========================================================================
        const buddhaGroup = new THREE.Group();
        scene.add(buddhaGroup);

        const loader = new THREE.GLTFLoader();
        loader.load(
            'glass+buddha+statue+3d+model.glb',
            (gltf) => {
                const buddhaMesh = gltf.scene;
                buddhaMesh.traverse((node) => {
                    if (node.isMesh) {
                        node.material = privacyBlueGlass;
                        node.castShadow = true; node.receiveShadow = true;
                    }
                });
                buddhaMesh.scale.set(1.4, 1.4, 1.4);
                buddhaMesh.position.set(0.0, -0.5, -0.18);
                buddhaMesh.rotation.y = Math.PI / 2;
                buddhaGroup.add(buddhaMesh);
                loadingOverlay.style.opacity = 0;
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 600);
            },
            (xhr) => {
                if (xhr.total > 0) {
                    const pct = Math.round((xhr.loaded / xhr.total) * 100);
                    loadingText.innerText = `Calibrating Bodhicitta Matrix (${pct}%)`;
                }
            },
            (err) => {
                console.warn("Procedural fallback active.", err);
                const fg = new THREE.Group();
                const head  = new THREE.Mesh(new THREE.SphereGeometry(0.25, 32, 32), privacyBlueGlass);
                head.position.y = 0.55; fg.add(head);
                const torso = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.28, 0.65, 32), privacyBlueGlass);
                torso.position.y = 0.1; fg.add(torso);
                const legs  = new THREE.Mesh(new THREE.TorusGeometry(0.3, 0.12, 16, 100), privacyBlueGlass);
                legs.rotation.x = Math.PI / 2; legs.position.y = -0.25; fg.add(legs);
                fg.position.set(0.0, -0.5, -0.18);
                fg.rotation.y = Math.PI / 2;
                buddhaGroup.add(fg);
                loadingOverlay.style.opacity = 0;
                setTimeout(() => { loadingOverlay.style.display = 'none'; }, 600);
            }
        );

        // =========================================================================
        // Axis labels (coordinate naming preserved, no laser beams)
        // =========================================================================
        function createAxisLabel(text, x, y, z) {
            const canvas = document.createElement('canvas');
            canvas.width = 128; canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 128, 128);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillStyle = '#ffd700'; ctx.font = 'bold 36px sans-serif';
            ctx.shadowColor = '#ffaa00'; ctx.shadowBlur = 10;
            ctx.fillText(text, 64, 64);
            const sprite = new THREE.Sprite(new THREE.SpriteMaterial({
                map: new THREE.CanvasTexture(canvas), transparent: true
            }));
            sprite.position.set(x, y, z);
            sprite.scale.set(0.6, 0.6, 1.0);
            scene.add(sprite);
        }
        createAxisLabel("+X",  3.2,  0,    0);
        createAxisLabel("-X", -3.2,  0,    0);
        createAxisLabel("+Y",  0,    3.2,  0);
        createAxisLabel("-Y",  0,   -3.2,  0);
        createAxisLabel("+Z",  0,    0,    3.2);
        createAxisLabel("-Z",  0,    0,   -3.2);

        // =========================================================================
        // VA Viên Mãn — sphere & glyph plane creation
        // =========================================================================
        const nodeSphereGeo = new THREE.SphereGeometry(0.15, 32, 32);
        const nodePlaneGeo  = new THREE.PlaneGeometry(0.30, 0.30);
        const textureLoader = new THREE.TextureLoader();

        function createFallbackGlyphTexture(char, phonetic) {
            const canvas = document.createElement('canvas');
            canvas.width = 512; canvas.height = 512;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, 512, 512);
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.shadowColor = '#aa00ff'; ctx.shadowBlur = 30;
            ctx.fillStyle = '#ffffff'; ctx.font = 'bold 220px sans-serif';
            ctx.fillText(char, 256, 210);
            ctx.shadowBlur = 8; ctx.fillStyle = '#cc88ff'; ctx.font = '600 46px sans-serif';
            ctx.fillText(phonetic.toUpperCase(), 256, 400);
            const tex = new THREE.CanvasTexture(canvas);
            tex.colorSpace = THREE.SRGBColorSpace;
            return tex;
        }

        // Build progress dots in HUD
        animationNodes.forEach((_, i) => {
            const dot = document.createElement('div');
            dot.className = 'hud-dot';
            dot.id = `hud-dot-${i}`;
            hudProgress.appendChild(dot);
        });

        // Create meshes for each animation node
        animationNodes.forEach((data) => {
            const pos = new THREE.Vector3(data.excelPos[0], data.excelPos[1], data.excelPos[2]);

            // Purple glass sphere
            const mat = new THREE.MeshPhysicalMaterial({
                color: 0xaa00ff,
                emissive: new THREE.Color(0x660099),
                emissiveIntensity: 0.0,
                roughness: 0.08, metalness: 0.05,
                transmission: 0.85, ior: 1.52, thickness: 0.25,
                transparent: true, opacity: 1.0,
                side: THREE.DoubleSide, depthWrite: false
            });
            const sphere = new THREE.Mesh(nodeSphereGeo, mat);
            sphere.position.copy(pos);
            sphere.visible = false;
            scene.add(sphere);
            data.sphereMesh = sphere;

            // Glyph plane with fallback canvas texture
            const charMat = new THREE.MeshBasicMaterial({
                map: createFallbackGlyphTexture(data.char, data.phonetic),
                transparent: true, side: THREE.DoubleSide,
                depthWrite: false, blending: THREE.AdditiveBlending
            });
            const plane = new THREE.Mesh(nodePlaneGeo, charMat);
            plane.position.copy(pos);
            plane.visible = false;
            scene.add(plane);
            data.planeMesh = plane;

            // Attempt to load PNG texture (try uppercase then lowercase extension)
            textureLoader.load(
                data.image,
                (tex) => {
                    tex.colorSpace = THREE.SRGBColorSpace;
                    charMat.map = tex; charMat.needsUpdate = true;
                },
                undefined,
                () => {
                    textureLoader.load(
                        data.image.replace('.PNG', '.png'),
                        (tex) => {
                            tex.colorSpace = THREE.SRGBColorSpace;
                            charMat.map = tex; charMat.needsUpdate = true;
                        }
                    );
                }
            );
        });

        // =========================================================================
        // Sequencer state
        // =========================================================================
        let currentIndex = -1;
        let isRunning    = false;
        let seqTimer     = 0;

        function getNodeInterval() {
            return parseFloat(intervalSpeedInput.value);
        }

        function updateHUD(index) {
            if (index < 0) { nodeHud.classList.remove('active'); return; }
            const d = animationNodes[index];
            hudId.innerText       = `${d.id} — ${d.series}`;
            hudName.innerText     = d.name;
            hudPhonetic.innerText = d.char;
            hudChakra.innerText   = d.chakra;
            hudPos.innerText      = `X:${d.excelPos[0].toFixed(1)}  Y:${d.excelPos[1].toFixed(1)}  Z:${d.excelPos[2].toFixed(1)}`;
            hudPhon.innerText     = d.phonetic;
            nodeHud.classList.add('active');
            // Progress dots
            animationNodes.forEach((_, i) => {
                const dot = document.getElementById(`hud-dot-${i}`);
                if (dot) dot.classList.toggle('active', i === index);
            });
        }

        function showNode(index) {
            // Hide all nodes first
            animationNodes.forEach((d) => {
                if (d.sphereMesh) { d.sphereMesh.visible = false; d.sphereMesh.scale.setScalar(1.0); d.sphereMesh.material.emissiveIntensity = 0.0; }
                if (d.planeMesh)  { d.planeMesh.visible  = false; d.planeMesh.scale.setScalar(1.0); }
            });
            // Show the target node
            if (index >= 0 && index < animationNodes.length) {
                const d = animationNodes[index];
                if (d.sphereMesh) d.sphereMesh.visible = true;
                if (d.planeMesh)  d.planeMesh.visible  = true;
                updateHUD(index);
            }
        }

        function resetAnimation() {
            isRunning    = false;
            currentIndex = -1;
            seqTimer     = 0;
            animationNodes.forEach((d) => {
                if (d.sphereMesh) { d.sphereMesh.visible = false; d.sphereMesh.scale.setScalar(1.0); d.sphereMesh.material.emissiveIntensity = 0.0; }
                if (d.planeMesh)  { d.planeMesh.visible  = false; d.planeMesh.scale.setScalar(1.0); }
            });
            heartLight.intensity = 0.0;
            nodeHud.classList.remove('active');
            startBtn.innerText = "Start Formation";
        }

        // =========================================================================
        // UI bindings
        // =========================================================================
        startBtn.addEventListener('click', () => {
            if (isRunning) {
                resetAnimation();
            } else {
                resetAnimation();
                isRunning    = true;
                currentIndex = 0;
                showNode(0);
                startBtn.innerText = "Reset";
                uiContainer.classList.add('collapsed');
                uiToggleBtn.innerText = '▼';
            }
        });

        intervalSpeedInput.addEventListener('input', () => {
            intervalLabel.innerText = `${parseFloat(intervalSpeedInput.value).toFixed(1)} s / node`;
        });

        uiHeader.addEventListener('click', () => {
            const isCollapsed = uiContainer.classList.toggle('collapsed');
            uiToggleBtn.innerText = isCollapsed ? '▼' : '▲';
        });

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        // =========================================================================
        // Animation loop
        // =========================================================================
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const delta       = clock.getDelta();
            const elapsedTime = clock.getElapsedTime();

            // Pulsing core glow
            const glowVal = parseFloat(glowIntensityInput.value);
            coreLight.intensity = (Math.sin(elapsedTime * 2) * 0.4 + 1.2) * glowVal;
            coreLight.position.y = Math.sin(elapsedTime * 0.6) * 0.5;

            // Sequence stepping (looping)
            if (isRunning) {
                seqTimer += delta;
                if (seqTimer >= getNodeInterval()) {
                    seqTimer = 0;
                    // Wrap to next node, loop infinitely
                    currentIndex = (currentIndex + 1) % animationNodes.length;
                    showNode(currentIndex);
                }

                // Animate the active node
                if (currentIndex >= 0) {
                    const d = animationNodes[currentIndex];

                    // Sphere: pulse scale + emissive glow
                    if (d.sphereMesh && d.sphereMesh.visible) {
                        const pulse = 1.0 + Math.sin(elapsedTime * 4.0) * 0.12;
                        d.sphereMesh.scale.setScalar(pulse);
                        d.sphereMesh.material.emissiveIntensity =
                            (Math.sin(elapsedTime * 4.0) * 0.5 + 1.5) * glowVal;
                    }

                    // Glyph plane: float + slow spin
                    if (d.planeMesh && d.planeMesh.visible) {
                        const floatY = d.excelPos[1] + Math.sin(elapsedTime * 2.0) * 0.018;
                        d.planeMesh.position.y = floatY;
                        d.planeMesh.rotation.y = elapsedTime * 0.6;
                    }

                    // Heart-chakra accent light follows active node position
                    heartLight.position.set(d.excelPos[0], d.excelPos[1], d.excelPos[2]);
                    heartLight.intensity = (Math.sin(elapsedTime * 4.0) * 0.4 + 1.2) * glowVal;
                }
            } else {
                heartLight.intensity = 0.0;
            }

            // Auto-rotation (Buddha only; world-space labels stay fixed)
            const rpm = parseFloat(rotationSpeedInput.value);
            buddhaGroup.rotation.y += ((rpm * Math.PI * 2) / 60) * delta;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
